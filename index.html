<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encrypted Access</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,Arial,sans-serif;
}

body{
    background:#0b0b0f;
    overflow:hidden;
    color:white;
}

/* Background glow */

body::before{
    content:"";
    position:fixed;
    width:700px;
    height:700px;
    background:#7c3aed;
    filter:blur(180px);
    opacity:.18;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.container{
    position:relative;
    z-index:2;
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:520px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:45px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

.lock{
    font-size:65px;
    margin-bottom:15px;
}

h1{
    font-size:40px;
    margin-bottom:10px;
}

p{
    color:#bdbdbd;
    line-height:1.6;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#18181d;
    color:white;
    font-size:17px;
    outline:none;
}

button{
    width:100%;
    margin-top:18px;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#7c3aed;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 30px #7c3aed;
}

#error{
    color:#ff5a5a;
    margin-top:15px;
    display:none;
}

#secret{
    display:none;
    animation:fade .6s ease;
}

#secret h2{
    margin-top:20px;
    font-size:34px;
}

#secret img{
    width:260px;
    margin-top:25px;
    border-radius:20px;
    box-shadow:0 0 25px rgba(124,58,237,.5);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>
<body>

<div class="container">

<div class="card">

<div id="login">

<div class="lock">🔒</div>

<h1>Encrypt with Code</h1>

<p>
Enter the encryption code below to unlock the hidden content.
</p>

<input
type="password"
id="code"
placeholder="Enter code...">

<button onclick="unlock()">
Unlock
</button>

<div id="error">
Invalid encryption code.
</div>

</div>

<div id="secret">

<div class="lock">🔓</div>

<h2>this u boiii (also don't ask why i chose this pic OK i didn't have any other)</h2>

<img src="bear.png" alt="Hidden Image">

</div>

</div>

</div>

<script>

function unlock(){

const code=document.getElementById("code").value;

if(code==="cuck"){

document.getElementById("login").style.display="none";

document.getElementById("secret").style.display="block";

}else{

const err=document.getElementById("error");

err.style.display="block";

}

}

</script>

</body>
</html>
